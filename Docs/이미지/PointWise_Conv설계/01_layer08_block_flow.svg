<svg width="720" height="730" viewBox="0 0 720 730" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="730" fill="#FFFFFF"/>

  <!-- 입력 -->
  <rect x="190" y="20" width="340" height="48" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/>
  <text x="360" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2937">입력 특징 맵 · 64ch × 14×14</text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#4B5563">(Layer 07 출력)</text>

  <line x1="360" y1="68" x2="360" y2="96" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Stage 1 -->
  <rect x="140" y="100" width="440" height="120" rx="12" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1.6"/>
  <text x="360" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F5132">① 1×1 Pointwise 확장 (64 → 384)</text>
  <rect x="160" y="146" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="220" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F5132">Conv 1×1</text>
  <text x="220" y="183" text-anchor="middle" font-size="11" fill="#3E7D68">= 행렬곱(GEMM)</text>
  <line x1="280" y1="169" x2="298" y2="169" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="300" y="146" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="360" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F5132">BN</text>
  <text x="360" y="183" text-anchor="middle" font-size="11" fill="#3E7D68">가중치에 폴딩</text>
  <line x1="420" y1="169" x2="438" y2="169" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="440" y="146" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="500" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F5132">ReLU6</text>
  <text x="500" y="183" text-anchor="middle" font-size="11" fill="#3E7D68">상한 6 보장</text>

  <line x1="360" y1="220" x2="360" y2="256" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="375" y="243" font-size="12" fill="#4B5563">384 × 14×14</text>

  <!-- Stage 2 -->
  <rect x="140" y="260" width="440" height="120" rx="12" fill="#FCEAE8" stroke="#E2574C" stroke-width="1.6"/>
  <text x="360" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#8F2D25">② 3×3 Depthwise Conv (stride 1, pad 1)</text>
  <rect x="160" y="306" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#E2574C" stroke-width="1.2"/>
  <text x="220" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2D25">DW Conv 3×3</text>
  <text x="220" y="343" text-anchor="middle" font-size="11" fill="#B0554C">채널별 독립</text>
  <line x1="280" y1="329" x2="298" y2="329" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="300" y="306" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#E2574C" stroke-width="1.2"/>
  <text x="360" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2D25">BN</text>
  <text x="360" y="343" text-anchor="middle" font-size="11" fill="#B0554C">가중치에 폴딩</text>
  <line x1="420" y1="329" x2="438" y2="329" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="440" y="306" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#E2574C" stroke-width="1.2"/>
  <text x="500" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2D25">ReLU6</text>
  <text x="500" y="343" text-anchor="middle" font-size="11" fill="#B0554C">상한 6 보장</text>

  <line x1="360" y1="380" x2="360" y2="416" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="375" y="403" font-size="12" fill="#4B5563">384 × 14×14</text>

  <!-- Stage 3 -->
  <rect x="140" y="420" width="440" height="120" rx="12" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1.6"/>
  <text x="360" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F5132">③ 1×1 Pointwise 축소 (384 → 64)</text>
  <rect x="160" y="466" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="220" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F5132">Conv 1×1</text>
  <text x="220" y="503" text-anchor="middle" font-size="11" fill="#3E7D68">= 행렬곱(GEMM)</text>
  <line x1="280" y1="489" x2="298" y2="489" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="300" y="466" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="360" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F5132">BN</text>
  <text x="360" y="503" text-anchor="middle" font-size="11" fill="#3E7D68">가중치에 폴딩</text>
  <line x1="420" y1="489" x2="438" y2="489" stroke="#6B7280" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="440" y="466" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="500" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Linear</text>
  <text x="500" y="503" text-anchor="middle" font-size="11" fill="#6B7280">활성 없음</text>

  <!-- Residual 경로 -->
  <polyline points="530,44 648,44 648,600 396,600" fill="none" stroke="#7C5CBF" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <text x="658" y="320" font-size="12" font-weight="bold" fill="#7C5CBF" transform="rotate(90 658 320)">Residual (stride=1, in_ch=out_ch)</text>

  <!-- Adder -->
  <line x1="360" y1="540" x2="360" y2="578" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>
  <circle cx="360" cy="600" r="18" fill="#F0EBFA" stroke="#7C5CBF" stroke-width="1.8"/>
  <text x="360" y="606" text-anchor="middle" font-size="18" font-weight="bold" fill="#4C3585">+</text>

  <line x1="360" y1="618" x2="360" y2="648" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 출력 -->
  <rect x="190" y="652" width="340" height="48" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/>
  <text x="360" y="672" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2937">출력 특징 맵 · 64ch × 14×14</text>
  <text x="360" y="690" text-anchor="middle" font-size="12" fill="#4B5563">= ③ 결과 + 입력 (residual)</text>
</svg>
