<svg width="760" height="560" viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar3p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#7C5CBF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#FFFFFF"/>

  <!-- 가중치 버퍼 -->
  <rect x="310" y="24" width="220" height="62" rx="10" fill="#F0EBFA" stroke="#7C5CBF" stroke-width="1.6"/>
  <text x="420" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#4C3585">가중치 버퍼 (BRAM)</text>
  <text x="420" y="68" text-anchor="middle" font-size="11.5" fill="#6B4FA3">타일 순서·역순 재배열 (C 유틸 사전 처리)</text>
  <line x1="420" y1="86" x2="420" y2="126" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar3)"/>
  <text x="432" y="110" font-size="11.5" fill="#4B5563">shift-in · 8사이클 (오버헤드 ~4%)</text>

  <!-- 입력 버퍼 -->
  <rect x="30" y="170" width="160" height="80" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="110" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">입력 활성 버퍼</text>
  <text x="110" y="215" text-anchor="middle" font-size="11.5" fill="#4B5563">BRAM 8뱅크</text>
  <text x="110" y="232" text-anchor="middle" font-size="11.5" fill="#4B5563">int16 · Q3.12</text>
  <line x1="190" y1="210" x2="216" y2="210" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar3)"/>

  <!-- Skew FF -->
  <rect x="220" y="150" width="76" height="150" rx="10" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1.6"/>
  <text x="258" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F5132">Skew</text>
  <text x="258" y="214" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F5132">FF 체인</text>
  <text x="258" y="236" text-anchor="middle" font-size="11" fill="#3E7D68">행 i = i단 지연</text>
  <text x="258" y="252" text-anchor="middle" font-size="11" fill="#3E7D68">(총 224 FF)</text>
  <line x1="296" y1="210" x2="326" y2="210" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar3)"/>

  <!-- PE Array -->
  <rect x="330" y="130" width="240" height="190" rx="12" fill="#F0EBFA" stroke="#7C5CBF" stroke-width="2"/>
  <text x="450" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#4C3585">PE Array 8×8</text>
  <text x="450" y="192" text-anchor="middle" font-size="12.5" fill="#6B4FA3">weight-stationary systolic</text>
  <text x="450" y="212" text-anchor="middle" font-size="12.5" fill="#6B4FA3">DSP48E1 × 64 (예산 220의 29%)</text>
  <text x="450" y="232" text-anchor="middle" font-size="12.5" fill="#6B4FA3">int16 × int16 MAC</text>
  <text x="450" y="256" text-anchor="middle" font-size="12.5" fill="#6B4FA3">입력 → 우측 전달 · psum(32b) ↓ 누산</text>
  <text x="450" y="280" text-anchor="middle" font-size="11.5" fill="#6B4FA3">타일링: 열 48회 × 행 8회 (확장 단계 기준)</text>

  <line x1="450" y1="320" x2="450" y2="358" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar3)"/>
  <text x="462" y="344" font-size="11.5" fill="#4B5563">열별 valid + 쓰기 주소 오프셋(de-skew 흡수)</text>

  <!-- 누산 버퍼 -->
  <rect x="310" y="362" width="280" height="86" rx="10" fill="#FCEAE8" stroke="#E2574C" stroke-width="1.6"/>
  <text x="450" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#8F2D25">부분합 누산 버퍼</text>
  <text x="450" y="406" text-anchor="middle" font-size="11.5" fill="#B0554C">8뱅크 × 196 × 32b (BRAM18 ×8, 1R1W)</text>
  <text x="450" y="424" text-anchor="middle" font-size="11.5" fill="#B0554C">RMW: read → add → write (순차 주소 → hazard 없음)</text>
  <text x="450" y="441" text-anchor="middle" font-size="11.5" fill="#B0554C">first_tile bypass mux 초기화 (클리어 0사이클)</text>
  <line x1="590" y1="405" x2="616" y2="405" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar3)"/>

  <!-- 후처리 -->
  <rect x="620" y="362" width="120" height="86" rx="10" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1.6"/>
  <text x="680" y="384" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F5132">후처리 유닛</text>
  <text x="680" y="403" text-anchor="middle" font-size="11" fill="#3E7D68">+bias → ReLU6</text>
  <text x="680" y="419" text-anchor="middle" font-size="11" fill="#3E7D68">≫shift 재양자화</text>
  <text x="680" y="435" text-anchor="middle" font-size="11" fill="#3E7D68">residual 합</text>
  <line x1="680" y1="362" x2="680" y2="322" stroke="#6B7280" stroke-width="1.6" marker-end="url(#ar3)"/>

  <!-- 출력 버퍼 -->
  <rect x="620" y="258" width="120" height="62" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="680" y="283" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2937">출력 버퍼</text>
  <text x="680" y="303" text-anchor="middle" font-size="11.5" fill="#4B5563">int16 · Q3.12</text>

  <!-- residual 경로 -->
  <polyline points="110,250 110,520 680,520 680,448" fill="none" stroke="#7C5CBF" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#ar3p)"/>
  <text x="395" y="512" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7C5CBF">residual 경로 (입력 Q3.12 그대로 → 정수 덧셈 1개)</text>

  <!-- 제어 FSM -->
  <rect x="30" y="330" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="130" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">제어 FSM</text>
  <text x="130" y="376" text-anchor="middle" font-size="11.5" fill="#4B5563">타일 카운터 · load_mode</text>
  <text x="130" y="393" text-anchor="middle" font-size="11.5" fill="#4B5563">valid_j = (cnt≥8+j)&amp;&amp;(cnt&lt;8+j+196)</text>
  <text x="130" y="410" text-anchor="middle" font-size="11.5" fill="#4B5563">주소 생성 · 레이어 설정 레지스터</text>
  <line x1="230" y1="378" x2="326" y2="310" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 4"/>
</svg>
