<svg width="1100" height="600" viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="afr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#D63031" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="600" fill="#FFFFFF"/>

  <text x="150" y="40" font-size="16" font-weight="bold" fill="#1F2937">① layer8_top 시퀀서 FSM</text>
  <text x="150" y="60" font-size="11.5" fill="#4B5563">엔진들을 start/done 핸드셰이크로 순서대로 실행</text>

  <!-- 좌측: top 시퀀서 -->
  <g>
    <ellipse cx="170" cy="110" rx="55" ry="27" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.6"/>
    <text x="170" y="115" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2937">IDLE</text>
    <line x1="170" y1="137" x2="170" y2="176" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="180" y="162" font-size="11.5" fill="#4B5563">start = 1</text>

    <ellipse cx="170" cy="207" rx="55" ry="27" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1.6"/>
    <text x="170" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F5132">S_PW1</text>
    <text x="170" y="219" text-anchor="middle" font-size="10" fill="#3E7D68">64→384 설정</text>
    <line x1="170" y1="234" x2="170" y2="273" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="180" y="259" font-size="11.5" fill="#4B5563">pw_done</text>

    <ellipse cx="170" cy="304" rx="55" ry="27" fill="#FCEAE8" stroke="#E2574C" stroke-width="1.6"/>
    <text x="170" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2D25">S_DW</text>
    <text x="170" y="316" text-anchor="middle" font-size="10" fill="#B0554C">3×3 DW 엔진</text>
    <line x1="170" y1="331" x2="170" y2="370" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="180" y="356" font-size="11.5" fill="#4B5563">dw_done</text>

    <ellipse cx="170" cy="401" rx="55" ry="27" fill="#E7F5EF" stroke="#1D9E75" stroke-width="1.6"/>
    <text x="170" y="397" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F5132">S_PW2</text>
    <text x="170" y="413" text-anchor="middle" font-size="10" fill="#3E7D68">384→64 + residual</text>
    <line x1="170" y1="428" x2="170" y2="467" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="180" y="453" font-size="11.5" fill="#4B5563">pw_done</text>

    <ellipse cx="170" cy="498" rx="55" ry="27" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.6"/>
    <text x="170" y="503" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2937">DONE</text>
    <path d="M115 498 C 40 460, 40 150, 115 112" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="20" y="310" font-size="11.5" fill="#4B5563">layer_done=1</text>

    <path d="M240 207 C 285 240, 285 370, 240 401" fill="none" stroke="#1B6FD8" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="298" y="285" font-size="11" fill="#1B6FD8">같은 pw_engine</text>
    <text x="298" y="301" font-size="11" fill="#1B6FD8">재사용 (설정만 교체)</text>
    <text x="298" y="322" font-size="11" fill="#1B6FD8">BN·ReLU6는 상태 아님</text>
    <text x="298" y="338" font-size="11" fill="#1B6FD8">→ 후처리 데이터패스에 융합</text>
  </g>

  <!-- 우측: pw_engine 로컬 FSM -->
  <text x="560" y="40" font-size="16" font-weight="bold" fill="#1F2937">② pw_engine 로컬 FSM (수정안)</text>
  <text x="560" y="60" font-size="11.5" fill="#4B5563">카운터 3개: pos_cnt · c_tile(0~7) · f_tile(0~47) — 상한은 레이어 설정 레지스터</text>

  <g>
    <ellipse cx="650" cy="110" rx="55" ry="27" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.6"/>
    <text x="650" y="115" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2937">IDLE</text>
    <line x1="650" y1="137" x2="650" y2="176" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="660" y="162" font-size="11.5" fill="#4B5563">start = 1</text>

    <ellipse cx="650" cy="207" rx="55" ry="27" fill="#FFF6E5" stroke="#D68910" stroke-width="1.6"/>
    <text x="650" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5A00">LOAD</text>
    <text x="650" y="219" text-anchor="middle" font-size="10" fill="#A87413">shift-in · load_mode=1</text>
    <line x1="650" y1="234" x2="650" y2="273" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="660" y="259" font-size="11.5" fill="#4B5563">pos_cnt == 8 (PE_ROW)</text>

    <ellipse cx="650" cy="304" rx="55" ry="27" fill="#F0EBFA" stroke="#7C5CBF" stroke-width="1.6"/>
    <text x="650" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C3585">CALC</text>
    <text x="650" y="316" text-anchor="middle" font-size="10" fill="#6B4FA3">입력 스트리밍</text>
    <line x1="650" y1="331" x2="650" y2="370" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="660" y="352" font-size="11.5" fill="#4B5563">pos_cnt == 196 (LAYER_HW,</text>
    <text x="660" y="366" font-size="11.5" fill="#4B5563">= 14×14, 설정 레지스터)</text>

    <ellipse cx="650" cy="401" rx="55" ry="27" fill="#F0EBFA" stroke="#7C5CBF" stroke-width="1.6"/>
    <text x="650" y="397" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C3585">DRAIN</text>
    <text x="650" y="413" text-anchor="middle" font-size="10" fill="#6B4FA3">배열 비우기 + RMW 완료</text>

    <path d="M598 384 C 500 350, 500 260, 596 217" fill="none" stroke="#D63031" stroke-width="1.5" marker-end="url(#afr)"/>
    <text x="415" y="278" font-size="11" fill="#D63031">c_tile &lt; 7 → c_tile++, LOAD</text>
    <text x="415" y="294" font-size="11" fill="#D63031">c_tile==7 &amp;&amp; f_tile&lt;47 →</text>
    <text x="415" y="310" font-size="11" fill="#D63031">f_tile++, c_tile=0, LOAD</text>
    <text x="415" y="330" font-size="10.5" fill="#8A5A00">(drain: 행8 + skew7 + RMW≈3)</text>

    <line x1="705" y1="405" x2="838" y2="405" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="712" y="392" font-size="11.5" fill="#4B5563">c_tile==7 &amp;&amp; f_tile==47</text>

    <ellipse cx="895" cy="405" rx="52" ry="27" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.6"/>
    <text x="895" y="401" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F2937">DONE</text>
    <text x="895" y="417" text-anchor="middle" font-size="10" fill="#4B5563">pw_done 펄스 1클럭</text>
    <path d="M905 378 C 985 290, 940 140, 707 106" fill="none" stroke="#1F2937" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="950" y="220" font-size="11.5" fill="#4B5563">→ IDLE</text>
    <text x="950" y="236" font-size="10.5" fill="#4B5563">(APB ST_DONE과 동일:</text>
    <text x="950" y="251" font-size="10.5" fill="#4B5563">재트리거 방지 · done 1클럭 보장)</text>
  </g>

  <text x="550" y="560" text-anchor="middle" font-size="12" fill="#6B7280">전체 소요 = 48 필터타일 × 8 채널타일 × (LOAD 8 + CALC 196 + DRAIN ≈18) ≈ 8.5만 사이클 / 확장 단계</text>
</svg>
