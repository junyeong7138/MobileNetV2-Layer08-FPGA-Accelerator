<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">그림 4. 메모리 효율 추론 — 확장 텐서를 실체화하지 않는 t-way Split (논문 §5.1)</text>

  <!-- naive -->
  <text x="60" y="80" font-size="16" font-weight="700" fill="#0f172a">(a) 단순 구현: 중간 확장 텐서(h×w×tk) 전체를 메모리에 실체화</text>
  <rect x="80" y="100" width="110" height="40" rx="6" fill="#94a3b8" stroke="#334155"/>
  <text x="135" y="125" text-anchor="middle" font-size="12.5" font-weight="700">입력 h·w·k</text>
  <line x1="196" y1="120" x2="238" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
  <rect x="244" y="86" width="200" height="68" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="344" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">확장 텐서 h·w·tk 전체</text>
  <text x="344" y="136" text-anchor="middle" font-size="12.5" fill="#991b1b">t=6 → 입력의 6배 크기 상주 💥</text>
  <line x1="450" y1="120" x2="492" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
  <rect x="498" y="100" width="116" height="40" rx="6" fill="#94a3b8" stroke="#334155"/>
  <text x="556" y="125" text-anchor="middle" font-size="12.5" font-weight="700">출력 h·w·k′</text>
  <rect x="660" y="88" width="280" height="64" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="800" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">필요 메모리 ≈ |입력| + |확장 6배| + |출력|</text>
  <text x="800" y="136" text-anchor="middle" font-size="12.5" fill="#9a3412">임베디드 SRAM에 안 들어감 → DRAM 왕복 ↑</text>

  <line x1="60" y1="176" x2="940" y2="176" stroke="#e2e8f0" stroke-width="2"/>

  <!-- t-way split -->
  <text x="60" y="210" font-size="16" font-weight="700" fill="#0f172a">(b) t-way Split: F(x) = Σᵢ (Aᵢ ∘ N ∘ Bᵢ)(x) — 내부 연산이 채널별(per-channel)이라 분할 가능</text>
  <text x="60" y="232" font-size="13" fill="#475569">확장 채널 n=tk를 t조각(각 n/t)으로 쪼개 순차 계산·누적 → 한 시점에 조각 1개만 메모리 상주</text>

  <rect x="80" y="270" width="110" height="150" rx="6" fill="#94a3b8" stroke="#334155"/>
  <text x="135" y="340" text-anchor="middle" font-size="12.5" font-weight="700">입력</text>
  <text x="135" y="358" text-anchor="middle" font-size="12.5" font-weight="700">h·w·k</text>
  <text x="135" y="376" text-anchor="middle" font-size="11.5" fill="#1e293b">(상주 유지)</text>

  <!-- split slices -->
  <g>
    <line x1="196" y1="300" x2="240" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
    <rect x="246" y="282" width="190" height="36" rx="6" fill="#c7d2fe" stroke="#4338ca"/>
    <text x="341" y="305" text-anchor="middle" font-size="12.5" fill="#312e81">조각1: 1×1↑(n/t) → DW → 1×1↓</text>
    <line x1="442" y1="300" x2="486" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
  </g>
  <g>
    <line x1="196" y1="345" x2="240" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
    <rect x="246" y="327" width="190" height="36" rx="6" fill="#a5b4fc" stroke="#4338ca"/>
    <text x="341" y="350" text-anchor="middle" font-size="12.5" fill="#312e81">조각2: 1×1↑(n/t) → DW → 1×1↓</text>
    <line x1="442" y1="345" x2="486" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
  </g>
  <text x="341" y="392" text-anchor="middle" font-size="15" fill="#4338ca">⋮  (총 t조각 순차 수행)</text>

  <!-- accumulate -->
  <circle cx="512" cy="322" r="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="512" y="329" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Σ</text>
  <text x="512" y="362" text-anchor="middle" font-size="11.5" fill="#166534">누적(accumulate)</text>
  <line x1="534" y1="322" x2="578" y2="322" stroke="#334155" stroke-width="2" marker-end="url(#arr4)"/>
  <rect x="584" y="292" width="120" height="60" rx="6" fill="#94a3b8" stroke="#334155"/>
  <text x="644" y="318" text-anchor="middle" font-size="12.5" font-weight="700">출력 누산 버퍼</text>
  <text x="644" y="336" text-anchor="middle" font-size="12.5" font-weight="700">h·w·k′ (상주)</text>

  <rect x="740" y="252" width="200" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="840" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">메모리 하한 (논문식)</text>
  <text x="840" y="308" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="700">|s²k| + |s′²k′|</text>
  <text x="840" y="328" text-anchor="middle" font-size="13.5" fill="#166534" font-weight="700">+ O(max(s², s′²))</text>
  <text x="840" y="356" text-anchor="middle" font-size="12" fill="#15803d">= 입력 + 출력 bottleneck</text>
  <text x="840" y="374" text-anchor="middle" font-size="12" fill="#15803d">+ 채널 1개분 워킹 버퍼</text>
  <text x="840" y="402" text-anchor="middle" font-size="12" fill="#166534">MAdds 총량은 t와 무관</text>
  <text x="840" y="420" text-anchor="middle" font-size="12" fill="#166534">(연산량 불변, 메모리만 ↓)</text>

  <!-- constraints & caveat -->
  <rect x="60" y="450" width="430" height="88" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="80" y="476" font-size="13.5" font-weight="700" fill="#1e3a8a">성립 조건 2가지 (§5.1)</text>
  <text x="80" y="498" font-size="12.5" fill="#1e40af">① 내부 변환(ReLU6·DW conv)이 per-channel 연산일 것</text>
  <text x="80" y="518" font-size="12.5" fill="#1e40af">② 연속된 non-per-channel 연산(1×1)의 입출력 크기 비가 클 것</text>

  <rect x="510" y="450" width="430" height="88" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="530" y="476" font-size="13.5" font-weight="700" fill="#713f12">주의 (SW 구현 기준)</text>
  <text x="530" y="498" font-size="12.5" fill="#854d0e">행렬곱이 잘게 쪼개지면 캐시 미스로 런타임 저하</text>
  <text x="530" y="518" font-size="12.5" fill="#854d0e">→ 논문 권장: t-way split의 t는 2~5의 작은 상수</text>

  <!-- table 3 mini -->
  <rect x="60" y="556" width="880" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="80" y="580" font-size="13.5" font-weight="700" fill="#0f172a">효과 (Table 3 — 해상도별 실체화 필요 최대 메모리, 16-bit 활성화 기준):</text>
  <text x="80" y="606" font-size="13.5" fill="#334155">MobileNetV1 <tspan font-weight="700" fill="#b91c1c">1,600KB</tspan>  vs  ShuffleNet(2x,g=3) <tspan font-weight="700" fill="#b45309">600KB</tspan>  vs  <tspan font-weight="700" fill="#15803d">MobileNetV2 400KB</tspan> — bottleneck만 상주시키는 구조 덕분</text>
</svg>
